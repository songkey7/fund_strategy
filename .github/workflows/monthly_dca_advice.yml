name: Monthly DCA Advice

on:
  schedule:
    - cron: "0 9 25-31 * 1-5"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests akshare

      - name: Run monthly DCA advice
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          GITHUB_ACTIONS: "true"
        run: cd Fix_stratigy && python monthly_dca_advice.py
